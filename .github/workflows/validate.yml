name: Application validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Record Node.js runtime
        run: node --version
      - name: Verify the public build-review boundary
        run: node --test .github/scripts/stage-public-build-review.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Reject known dependency advisories
        run: npm audit --audit-level=low
      - name: Validate application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Install Chromium for the existing browser suite
        run: npm exec playwright install --with-deps chromium
      - name: Verify the production build in desktop and mobile Chromium
        env:
          CI: "true"
        run: npm exec playwright test
      - name: Stage public assets and build hashes without server-private material
        run: node .github/scripts/stage-public-build-review.mjs
      - name: Retain public assets and build hashes for static review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmonk-public-build-review-${{ github.sha }}-${{ github.run_id }}
          path: .build-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
